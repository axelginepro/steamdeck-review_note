name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create zip
        run: |
          mkdir -p build/SteamOS_Steam_review
          cp -r dist main.py package.json plugin.json README.md build/SteamOS_Steam_review/
          cd build
          zip -r SteamOS_Steam_review_${{ github.ref_name }}.zip \
            SteamOS_Steam_review \
            -x "*.gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true